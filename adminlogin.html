<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { display: flex; }
    .sidebar {
      min-width: 200px;
      max-width: 200px;
      background: #343a40;
      color: white;
      height: 100vh;
    }
    .sidebar a {
      display: block;
      color: white;
      padding: 15px;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #495057;
    }
    .main-content {
      flex-grow: 1;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h4 class="text-center mt-3">Admin Panel</h4>
    <a href="#" onclick="showSection('users')">Manage Users</a>
    <a href="#" onclick="showSection('products')">Manage Products</a>
    <a href="#" onclick="showSection('orders')">Manage Orders</a>
  </div>

  <div class="main-content">
    <div id="users" style="display:none;">
      <h2>Manage Users</h2>
      <p>Coming soon: List, block or delete users</p>
    </div>
    <div id="products" style="display:none;">
      <h2>Manage Products</h2>
      <p>Coming soon: Add, edit or delete products</p>
    </div>
    <div id="orders" style="display:none;">
      <h2>Manage Orders</h2>
      <p>Coming soon: View orders and update status</p>
    </div>
  </div>

  <script>
    function showSection(section) {
      document.getElementById('users').style.display = 'none';
      document.getElementById('products').style.display = 'none';
      document.getElementById('orders').style.display = 'none';
      document.getElementById(section).style.display = 'block';
    }
  </script>

</body>
</html>
