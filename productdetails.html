<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ product.name }}</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
      padding: 50px;
      justify-content: center;
      align-items: center;
    }
    .left-section {
      flex: 1;
      min-width: 400px;
      max-width: 500px;
      margin: 20px;
    }
    .left-section img {
      width: 100%;
      border-radius: 10px;
    }
    .right-section {
      flex: 1;
      min-width: 400px;
      max-width: 500px;
      margin: 20px;
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    .price {
      font-size: 22px;
      margin-bottom: 20px;
    }
    .sizes button {
      margin: 5px;
      padding: 10px 18px;
      font-size: 16px;
      border: none;
      background-color: white;
      color: black;
      border-radius: 4px;
      cursor: pointer;
    }
    .quantity {
      margin-top: 20px;
    }
    .quantity button {
      font-size: 20px;
      padding: 6px 12px;
      margin: 0 5px;
      background-color: white;
      color: black;
      border: none;
      border-radius: 4px;
    }
    .quantity span {
      font-size: 18px;
      margin: 0 10px;
    }
    .pay-now, .add-to-cart {
      margin-top: 20px;
      padding: 14px 28px;
      font-size: 18px;
      font-weight: bold;
      background-color: white;
      color: black;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: block;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="left-section">
      <img src="{{ url_for('static', filename='images/products/' + product.image) }}" alt="{{ product.name }}">
    </div>
    <div class="right-section">
      <h1>{{ product.name }}</h1>
      <div class="price">₹{{ product.price }}</div>

      {% if 'Accessories' not in category %}
      <!-- Fabric Customization -->
      <div class="mb-4">
        <label class="block text-white mb-2 font-semibold">Choose Fabric:</label>
        <select name="fabric" class="p-2 rounded w-full">
          <option value="Cotton">Cotton</option>
          <option value="Linen">Linen</option>
          <option value="Silk">Silk</option>
          <option value="Nylon">Nylon</option>
          <option value="Polyester">Polyester</option>
          <option value="Organza">Organza</option>
          <option value="Chiffon">Chiffon</option>
        </select>
      </div>

      <!-- Size Selection -->
      <div class="sizes">
        <p>Choose Size:</p>
        <button>XS</button>
        <button>S</button>
        <button>M</button>
        <button>L</button>
        <button>XL</button>
        <button>XXL</button>
      </div>
      {% endif %}

      <div class="quantity">
        <p>Quantity:</p>
        <button onclick="decreaseQty()">-</button>
        <span id="qty">1</span>
        <button onclick="increaseQty()">+</button>
      </div>

      <!-- Add to Cart Form -->
      <button class="add-to-cart" onclick="addToCart({{ product.id }})">Add to Cart</button>

      <script>
        function addToCart(productId) {
          const token = localStorage.getItem("token");
      
          if (!token) {
            alert("Please login first to add items to cart!");
            return;
          }
      
          fetch("http://127.0.0.1:5000/add_to_cart", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": `Bearer ${token}`
            },
            body: JSON.stringify({
              product_id: productId,
              quantity: 1
            })
          })
          .then(res => res.json())
          .then(data => {
            console.log("Cart Response:", data);
            alert("Added to cart successfully!");
          })
          .catch(err => {
            console.error("Error:", err);
            alert("Something went wrong!");
          });
        }
      </script>
      


      <!-- Razorpay Payment Form -->
<form id="pay-form" action="/payments/create_order" method="POST">
    <input type="hidden" name="product_id" value="{{ product.id }}">
    <input type="hidden" id="quantity_input" name="quantity" value="1">
    <button class="pay-now" type="button" id="pay-now-btn">Pay Now</button>
  </form>
  
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    document.getElementById('pay-now-btn').onclick = function(e) {
      e.preventDefault();
  
      const token = localStorage.getItem('token'); // ✅ Add this line brooo 💥
  
      if (!token) {
        alert("User not logged in. Please login first.");
        return;
      }
  
      fetch('http://127.0.0.1:5000/api/payments/create_order', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({
          product_id: 1,
          quantity: document.getElementById('quantity_input').value
        })
      })
      .then(response => response.json())
      .then(data => {
        if (data.order_id) {
          var options = {
            "key": "rzp_test_UJOyiCZ1FFC00z", // 🔑 Use your real key here
            "amount": data.amount,
            "currency": "INR",
            "order_id": data.order_id,
            "name": "{{ product.name }}",
            "description": "Product Payment",
            "image": "https://yourdomain.com/logo.png",
            "handler": function (response) {
              alert("✅ Payment successful! Payment ID: " + response.razorpay_payment_id);
              // You can redirect or call backend to save payment
            },
            "prefill": {
              "name": "Your Name",
              "email": "youremail@domain.com",
              "contact": "9876543210"
            },
            "notes": {
              "address": "Your address"
            }
          };
  
          var rzp1 = new Razorpay(options);
          rzp1.open();
        } else {
          alert("❌ Error creating order. Please try again.");
        }
      })
      .catch(err => {
        console.error("Fetch error 💥:", err);
        alert("Something went wrong, bro 😢");
      });
    }
  </script>
  

      <script>
        let qty = 1;
        function increaseQty() {
          qty++;
          document.getElementById("qty").innerText = qty;
          document.getElementById("quantity_input").value = qty;
          document.getElementById("cart_quantity").value = qty;
        }
        function decreaseQty() {
          if (qty > 1) {
            qty--;
            document.getElementById("qty").innerText = qty;
            document.getElementById("quantity_input").value = qty;
            document.getElementById("cart_quantity").value = qty;
          }
        }
      </script>
    </div>
  </div>
</body>
</html>
