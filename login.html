<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Lume and Luxe Textile Shop</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #e6e6fa, #f8f8ff);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background-color: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      width: 350px;
    }

    h2 {
      text-align: center;
      color: #5d4b8b;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      margin: 10px 0;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 1em;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1em;
      background-color: #5d4b8b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #4c3b72;
    }

    #message {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p id="message"></p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
  
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
  
      try {
        const response = await fetch('http://127.0.0.1:5000/users/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });
  
        let result;
        try {
          result = await response.json();
        } catch (parseError) {
          throw new Error('Invalid server response');
        }
  
        const message = document.getElementById('message');
        if (response.ok && result.token) {
          localStorage.setItem('token', result.token);
          message.style.color = 'green';
          message.textContent = 'Login successful!';
          setTimeout(() => {
            window.location.href = '/';
          }, 1000);
        } else {
          message.style.color = 'red';
          message.textContent = result.error || 'Login failed';
        }
      } catch (err) {
        console.error("Login error:", err);
        document.getElementById('message').style.color = 'red';
        document.getElementById('message').textContent = 'Login request failed';
      }
    });
  </script>
</body>
</html>
